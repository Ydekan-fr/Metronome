name: Build
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: Ydeclik
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ydeclik-apk
          path: Ydeclik/app/build/outputs/apk/debug/app-debug.apk
